name: Build ZabanYar.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt pyinstaller pytest

      - name: Prepare dictionaries and icon
        run: |
          python tools/make_wordlists.py
          python tools/make_ico.py

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --noconsole --onefile --name ZabanYar
          --icon "assets\ZabanYar.ico" --version-file version_info.txt
          --add-data "data;data" --hidden-import pystray._win32
          --collect-submodules pystray --hidden-import PIL._tkinter_finder app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ZabanYar
          path: dist/ZabanYar.exe

      - name: Publish release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZabanYar.exe
          generate_release_notes: true
          overwrite_files: true
